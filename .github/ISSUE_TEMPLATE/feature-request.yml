name: 许愿 / Feature request
description: 提议一个符合 DPIS 能力范围的功能或改进。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        DPIS 更希望实现通用的功能，而不是只针对单个应用的适配。

        DPIS works best when feature requests describe a reusable behavior, not only one app-specific workaround.

  - type: textarea
    id: problem
    attributes:
      label: 问题场景 / Problem
      description: |
        在实际使用的过程中有不顺手或功能缺失？
        What feels awkward, missing, or incompatible in daily use?
      placeholder: "When using ..., DPIS cannot ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
      description: |
        描述你希望的功能添加或改动。
        Describe the feature or change you want.
    validations:
      required: true

  - type: textarea
    id: current-workaround
    attributes:
      label: 当前替代方案 / Current workaround
      description: |
        你是否有尝试绕过这个问题？成功了吗？
        Have you tried a workaround? Did it help?
    validations:
      required: false

  - type: input
    id: affected-apps
    attributes:
      label: 相关应用或包名 / Affected apps or packages
      description: |
        如果来自应用兼容性问题，请填写对应包名。
        Include package names if this comes from app compatibility testing.
      placeholder: "com.example.app"
    validations:
      required: false

  - type: textarea
    id: dpis-context
    attributes:
      label: DPIS 上下文 / DPIS context
      description: |
        如相关，请包含 APK 类型、Android/LSPosed 环境、route、viewport、字体或 hook-chain 信息。
        Include variant, Android/LSPosed environment, route, viewport, font, or hook-chain context if relevant.
      placeholder: |
        APK 类型 / Variant:
        Android / LSPosed:
        Route:
        Viewport / 字体配置 / font settings:
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
      description: |
        其他可能解法，以及为什么/是否需要包名特化。
        Other ways this could be solved, including why package-specific behavior may or may not be necessary.
    validations:
      required: false
