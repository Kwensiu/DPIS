name: 问题反馈 / Bug report
description: 反馈 DPIS 的行为、兼容性或运行时 hook 问题。
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 DPIS 相关问题！如果是运行时 hook、目标应用兼容性、字体/viewport 未生效、闪退或卡顿问题，请优先在 DPIS 中导出“反馈诊断”并随 issue 上传。

        反馈诊断会比手工整理配置和日志更可靠，也不包含个人隐私信息。纯 UI、文案、发布或无法复现的问题可以不上传，但请说明原因。

        Thanks for reporting a DPIS issue. For runtime hooks, target-app compatibility, font/viewport not applying, crashes, or jank, please export a feedback diagnostic package from DPIS and upload it with this issue. It is more reliable than manually copying settings/logs and does not include personal private data. UI/text/release issues or non-reproducible issues may skip it; please explain why.

  - type: textarea
    id: feedback-diagnostic
    attributes:
      label: 反馈诊断包 / Feedback diagnostic package
      description: |
        运行时或兼容性问题请拖拽上传 DPIS 导出的反馈诊断 zip。若未上传，请简单说明原因。
        For runtime or compatibility issues, upload the feedback diagnostic zip exported by DPIS. If you do not upload one, briefly explain why.
      placeholder: |
        请在这里拖入 .zip 文件，或说明未上传原因
        Drag the exported .zip here, or explain why it is not attached
    validations:
      required: false

  - type: input
    id: dpis-version
    attributes:
      label: DPIS 版本 / Version
      description: |
        填写版本号、commit 或构建标识。
        Include the version name or commit/build identifier.
      placeholder: "1.12.0"
    validations:
      required: true

  - type: dropdown
    id: dpis-variant
    attributes:
      label: APK 类型 / APK variant
      options:
        - 标准版 / Modern
        - 传统版 / Legacy
        - 两者都有 / Both
        - 不确定 / Not sure
    validations:
      required: true

  - type: input
    id: android-environment
    attributes:
      label: Android 环境 / Android environment
      description: |
        Android 版本、ROM/OEM 系统、Root 方式、LSPosed/Xposed 版本。
        Android version, ROM/OEM skin, root method, and LSPosed/Xposed version.
      placeholder: "Android 15, HyperOS, Magisk, LSPosed 1.10.x"
    validations:
      required: true

  - type: input
    id: target-app
    attributes:
      label: 目标应用 / Target app
      description: |
        受影响应用的包名和版本。
        Package name and app version affected by the issue.
      placeholder: "com.example.app, version 1.2.3"
    validations:
      required: true

  - type: textarea
    id: key-settings
    attributes:
      label: 关键配置补充 / Key DPIS details
      description: |
        只补充诊断包里不容易看出的关键点，例如是否用了自定义 hook-chain、特殊开关、草稿未保存状态等。
        Only add details that may not be obvious from the diagnostic package, such as custom hook-chain choices, special toggles, or unsaved draft state.
      placeholder: |
        自定义 hook-chain / Custom hook-chain:
        特殊开关 / Special toggles:
        其他补充 / Other notes:
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: |
        尽量从启用 DPIS 或重新启动目标应用开始。
        Start from enabling DPIS or launching the target app when possible.
      placeholder: |
        1. 为 ... 启用 DPIS / Enable DPIS for ...
        2. 重新启动 ... / Relaunch ...
        3. 打开 ... / Open ...
        4. 观察到 ... / Observe ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: |
        实际发生了什么？如果和预期不一致，请直接在这里说明差异。如有帮助，请附截图或录屏。
        What happens? If it differs from what you expected, describe the difference here. Include screenshots or screen recordings if they help.
    validations:
      required: true

  - type: textarea
    id: extra-logs
    attributes:
      label: 额外日志或材料 / Extra logs or materials
      description: |
        仅在反馈诊断不足以说明问题时再补充，例如额外的 LSPosed 日志、截图或录屏说明。
        Only add this when the feedback diagnostic package is not enough, for example extra LSPosed log lines, screenshots, or recording notes.
      render: text
      placeholder: |
        额外日志 / Extra logs:
    validations:
      required: false

  - type: textarea
    id: extra-context
    attributes:
      label: 补充信息 / Additional context
      description: |
        说明重启、重新启用模块、清除应用数据、重装后是否仍复现。不要包含私人 token 或无关个人数据。
        Mention whether the issue survives reboot, module re-enable, app data clear, or reinstall. Do not include private tokens or unrelated personal data.
    validations:
      required: false
