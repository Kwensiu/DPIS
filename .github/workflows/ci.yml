name: CI Check

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional Gradle --tests filter (e.g. com.dpis.module.*Hook*Test)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_HARDLINK: 'true'
      CCACHE_NOHASHDIR: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DPIS_CMAKE_VERSION: 3.22.1
      DPIS_CMAKE_COMPILER_LAUNCHER: ccache
      DPIS_NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmake;${DPIS_CMAKE_VERSION}" "ndk;${DPIS_NDK_VERSION}"

      - name: Install native build cache
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache -o max_size=1G
          ccache -o hash_dir=false
          ccache -o hard_link=true
          ccache -o compiler_check="$CCACHE_COMPILERCHECK"
          ccache -z

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: native-ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            native-ccache-${{ runner.os }}-

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build and verify
        shell: bash
        env:
          TEST_FILTER: ${{ github.event.inputs.test_filter }}
        run: |
          if [[ -n "${TEST_FILTER}" ]]; then
            ./gradlew :app:assembleModernDebug :app:assembleLegacyDebug :app:testDebugUnitTest --tests "${TEST_FILTER}" :app:lintModernDebug --stacktrace
          else
            ./gradlew :app:assembleModernDebug :app:assembleLegacyDebug :app:testAllDebugUnitTests :app:lintModernDebug --stacktrace
          fi
          ccache -s

      - name: Summarize PR debug APK checksums
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo "### PR debug APK checksums"
            echo "| Package | SHA256 |"
            echo "|:--|:--|"
            for apk in app/build/outputs/apk/modern/debug/*.apk app/build/outputs/apk/legacy/debug/*.apk; do
              [[ -f "$apk" ]] || continue
              package="$(basename "$apk")"
              echo "| ${package} | \`$(sha256sum "$apk" | awk '{print $1}')\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/testModernDebugUnitTest
            app/build/reports/tests/testLegacyDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/test-results/testModernDebugUnitTest
            app/build/test-results/testLegacyDebugUnitTest
            app/build/reports/lint-results-modernDebug.html
            app/build/reports/lint-results-modernDebug.xml

      - name: Upload PR debug APKs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-debug-apks-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            app/build/outputs/apk/modern/debug/*.apk
            app/build/outputs/apk/legacy/debug/*.apk
