name: Telegram Preview Build

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/.release-please-manifest.json'
      - '.github/workflows/telegram-preview.yml'
      - 'scripts/telegram-preview-media.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Check preview skip marker
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MESSAGES="$(jq -r '.commits[]?.message // empty' "$GITHUB_EVENT_PATH")"
          if grep -Fq "[skip preview]" <<< "$COMMIT_MESSAGES"; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=[skip preview] commit marker" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=no skip marker" >> "$GITHUB_OUTPUT"

  build-and-send:
    needs: preview-gate
    if: needs.preview-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Derive preview version
        id: preview
        shell: bash
        run: |
          BASE_VERSION="$(jq -r '.["."]' .github/.release-please-manifest.json)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Base version must be semantic version x.y.z: $BASE_VERSION"
            exit 1
          fi

          RUN_NUMBER="${{ github.run_number }}"
          if (( RUN_NUMBER < 1 || RUN_NUMBER > 9999 )); then
            echo "GitHub run number must stay in 1..9999 for preview versionCode mapping: $RUN_NUMBER"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          BASE_VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          PREVIEW_VERSION_CODE=$((BASE_VERSION_CODE * 10000 + RUN_NUMBER))
          if (( PREVIEW_VERSION_CODE > 2100000000 )); then
            echo "Preview versionCode exceeds Android limit: $PREVIEW_VERSION_CODE"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          PREVIEW_VERSION_NAME="${BASE_VERSION}-${RUN_NUMBER}.${SHORT_SHA}"

          echo "version_name=$PREVIEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$PREVIEW_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Summarize preview target
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          {
            echo "### Telegram preview"
            echo "- Ref: \`${REF_NAME}\`"
            echo "- Gate: ${{ needs.preview-gate.outputs.reason }}"
            if [[ "$REF_TYPE" == "branch" && "$REF_NAME" != "main" ]]; then
              echo "- Notice: this preview was built from a non-main branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Validate release signing secrets
        shell: bash
        env:
          DPIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DPIS_RELEASE_KEYSTORE_BASE64 }}
          DPIS_RELEASE_STORE_PASSWORD: ${{ secrets.DPIS_RELEASE_STORE_PASSWORD }}
          DPIS_RELEASE_KEY_ALIAS: ${{ secrets.DPIS_RELEASE_KEY_ALIAS }}
          DPIS_RELEASE_KEY_PASSWORD: ${{ secrets.DPIS_RELEASE_KEY_PASSWORD }}
        run: |
          for key in \
            DPIS_RELEASE_KEYSTORE_BASE64 \
            DPIS_RELEASE_STORE_PASSWORD \
            DPIS_RELEASE_KEY_ALIAS \
            DPIS_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Prepare release keystore
        shell: bash
        env:
          DPIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DPIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${GITHUB_WORKSPACE}/.keystore"
          KEYSTORE_PATH="${KEYSTORE_DIR}/release.jks"
          mkdir -p "${KEYSTORE_DIR}"
          echo "${DPIS_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"

      - name: Build preview APKs
        env:
          DPIS_RELEASE_STORE_FILE: ${{ github.workspace }}/.keystore/release.jks
          DPIS_RELEASE_STORE_PASSWORD: ${{ secrets.DPIS_RELEASE_STORE_PASSWORD }}
          DPIS_RELEASE_KEY_ALIAS: ${{ secrets.DPIS_RELEASE_KEY_ALIAS }}
          DPIS_RELEASE_KEY_PASSWORD: ${{ secrets.DPIS_RELEASE_KEY_PASSWORD }}
          DPIS_VERSION_NAME: ${{ steps.preview.outputs.version_name }}
          DPIS_VERSION_CODE: ${{ steps.preview.outputs.version_code }}
        run: ./gradlew :app:assembleRelease

      - name: Summarize APK checksums
        shell: bash
        env:
          VERSION_NAME: ${{ steps.preview.outputs.version_name }}
        run: |
          APKS=(
            "app/build/outputs/apk/modern101/release/DPIS_${VERSION_NAME}.apk"
            "app/build/outputs/apk/compat100/release/DPIS_${VERSION_NAME}_legacy.apk"
          )
          for apk in "${APKS[@]}"; do
            if [[ ! -f "$apk" ]]; then
              echo "APK not found: $apk"
              exit 1
            fi
          done

          {
            echo "### APK checksums"
            echo "| Package | SHA256 |"
            echo "|:--|:--|"
            echo "| modern | \`$(sha256sum "${APKS[0]}" | awk '{print $1}')\` |"
            echo "| legacy | \`$(sha256sum "${APKS[1]}" | awk '{print $1}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DPIS-preview-${{ steps.preview.outputs.version_name }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/modern101/release/DPIS_${{ steps.preview.outputs.version_name }}.apk
            app/build/outputs/apk/compat100/release/DPIS_${{ steps.preview.outputs.version_name }}_legacy.apk

      - name: Send APKs to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_PROTECT_CONTENT: ${{ secrets.TELEGRAM_PROTECT_CONTENT }}
          VERSION_NAME: ${{ steps.preview.outputs.version_name }}
          VERSION_CODE: ${{ steps.preview.outputs.version_code }}
          SHORT_SHA: ${{ steps.preview.outputs.short_sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "TELEGRAM_BOT_TOKEN is not set"
            exit 1
          fi

          CHAT_TARGETS="${TELEGRAM_CHAT_IDS:-$TELEGRAM_CHAT_ID}"
          if [[ -z "$CHAT_TARGETS" ]]; then
            echo "TELEGRAM_CHAT_ID or TELEGRAM_CHAT_IDS is required"
            exit 1
          fi

          APKS=(
            "app/build/outputs/apk/modern101/release/DPIS_${VERSION_NAME}.apk"
            "app/build/outputs/apk/compat100/release/DPIS_${VERSION_NAME}_legacy.apk"
          )
          for apk in "${APKS[@]}"; do
            if [[ ! -f "$apk" ]]; then
              echo "APK not found: $apk"
              exit 1
            fi
          done

          latest_formal_release_tag() {
            git for-each-ref --merged "${{ github.sha }}" \
              --sort=-creatordate \
              --format='%(refname:short)' refs/tags \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1
          }

          COMMIT_SUBJECT="$(git log -1 --format=%s "${{ github.sha }}")"
          LAST_RELEASE_TAG="$(latest_formal_release_tag || true)"
          CHANGELOG_COMMITS="$(mktemp)"
          trap 'rm -f "$CHANGELOG_COMMITS"' EXIT
          if [[ -n "$LAST_RELEASE_TAG" ]]; then
            git log --no-merges --pretty=format:'%h%x09%H%x09%s' "${LAST_RELEASE_TAG}..${{ github.sha }}" > "$CHANGELOG_COMMITS"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${LAST_RELEASE_TAG}...${{ github.sha }}"
          else
            git log --no-merges --pretty=format:'%h%x09%H%x09%s' -n 10 "${{ github.sha }}" > "$CHANGELOG_COMMITS"
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${{ github.sha }}"
          fi
          BRANCH_NAME=""
          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" != "main" ]]; then
            BRANCH_NAME="$REF_NAME"
          fi
          MEDIA_JSON="$(
            python scripts/telegram-preview-media.py \
              --title-preset preview \
              --short-sha "$SHORT_SHA" \
              --commit-url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
              --commit-subject "$COMMIT_SUBJECT" \
              --commits-file "$CHANGELOG_COMMITS" \
              --repository-url "https://github.com/${{ github.repository }}" \
              --release-tag "${LAST_RELEASE_TAG:-initial commit}" \
              --compare-url "$COMPARE_URL" \
              --version-name "$VERSION_NAME" \
              --version-code "$VERSION_CODE" \
              --branch-name "$BRANCH_NAME"
          )"
          IFS=',' read -ra CHAT_IDS <<< "$CHAT_TARGETS"
          for chat_id in "${CHAT_IDS[@]}"; do
            chat_id="$(echo "$chat_id" | xargs)"
            [[ -z "$chat_id" ]] && continue
            args=(
              --form-string "chat_id=${chat_id}"
              --form-string "media=${MEDIA_JSON}"
              -F "modern_apk=@${APKS[0]}"
              -F "legacy_apk=@${APKS[1]}"
            )
            if [[ -n "$TELEGRAM_MESSAGE_THREAD_ID" ]]; then
              args+=(--form-string "message_thread_id=${TELEGRAM_MESSAGE_THREAD_ID}")
            fi
            if [[ "$TELEGRAM_PROTECT_CONTENT" == "true" ]]; then
              args+=(--form-string "protect_content=true")
            fi
            curl --fail --show-error --silent \
              "${args[@]}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup"
          done
