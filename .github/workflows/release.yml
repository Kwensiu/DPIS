name: Release Build

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_HARDLINK: 'true'
      CCACHE_NOHASHDIR: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DPIS_CMAKE_VERSION: 3.22.1
      DPIS_CMAKE_COMPILER_LAUNCHER: ccache
      DPIS_NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmake;${DPIS_CMAKE_VERSION}" "ndk;${DPIS_NDK_VERSION}"

      - name: Install native build cache
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache -o max_size=1G
          ccache -o hash_dir=false
          ccache -o hard_link=true
          ccache -o compiler_check="$CCACHE_COMPILERCHECK"
          ccache -z

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: native-ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            native-ccache-${{ runner.os }}-

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Validate release signing secrets
        shell: bash
        env:
          DPIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DPIS_RELEASE_KEYSTORE_BASE64 }}
          DPIS_RELEASE_STORE_PASSWORD: ${{ secrets.DPIS_RELEASE_STORE_PASSWORD }}
          DPIS_RELEASE_KEY_ALIAS: ${{ secrets.DPIS_RELEASE_KEY_ALIAS }}
          DPIS_RELEASE_KEY_PASSWORD: ${{ secrets.DPIS_RELEASE_KEY_PASSWORD }}
        run: |
          for key in \
            DPIS_RELEASE_KEYSTORE_BASE64 \
            DPIS_RELEASE_STORE_PASSWORD \
            DPIS_RELEASE_KEY_ALIAS \
            DPIS_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Prepare release keystore
        shell: bash
        env:
          DPIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DPIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${GITHUB_WORKSPACE}/.keystore"
          KEYSTORE_PATH="${KEYSTORE_DIR}/release.jks"
          mkdir -p "${KEYSTORE_DIR}"
          echo "${DPIS_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"

      - name: Build release APK
        env:
          DPIS_RELEASE_STORE_FILE: ${{ github.workspace }}/.keystore/release.jks
          DPIS_RELEASE_STORE_PASSWORD: ${{ secrets.DPIS_RELEASE_STORE_PASSWORD }}
          DPIS_RELEASE_KEY_ALIAS: ${{ secrets.DPIS_RELEASE_KEY_ALIAS }}
          DPIS_RELEASE_KEY_PASSWORD: ${{ secrets.DPIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          ./gradlew :app:assembleRelease
          ccache -s

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "Tag is required"
            exit 1
          fi

          VERSION="$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Tag '$TAG' must include semantic version x.y.z"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          REPO="${{ github.repository }}"
          APK_NAME="DPIS_${VERSION}.apk"
          APK_PATH="app/build/outputs/apk/modern/release/${APK_NAME}"
          if [[ ! -f "$APK_PATH" ]]; then
            SOURCE_APK_PATH="app/build/outputs/apk/modern/release/app-modern-release.apk"
            if [[ ! -f "$SOURCE_APK_PATH" ]]; then
              echo "APK not found: $APK_PATH or $SOURCE_APK_PATH"
              exit 1
            fi
            cp "$SOURCE_APK_PATH" "$APK_PATH"
          fi
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}"

          COMPAT_APK_NAME="DPIS_${VERSION}_legacy.apk"
          COMPAT_APK_PATH="app/build/outputs/apk/legacy/release/${COMPAT_APK_NAME}"
          if [[ ! -f "$COMPAT_APK_PATH" ]]; then
            COMPAT_SOURCE="app/build/outputs/apk/legacy/release/app-legacy-release.apk"
            if [[ ! -f "$COMPAT_SOURCE" ]]; then
              echo "Legacy APK not found: $COMPAT_APK_PATH or $COMPAT_SOURCE"
              exit 1
            fi
            cp "$COMPAT_SOURCE" "$COMPAT_APK_PATH"
          fi
          COMPAT_APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${COMPAT_APK_NAME}"
          MANIFEST_URL="https://github.com/${REPO}/releases/latest/download/update.json"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "compat_apk_name=$COMPAT_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "compat_apk_path=$COMPAT_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "compat_apk_url=$COMPAT_APK_URL" >> "$GITHUB_OUTPUT"
          echo "manifest_url=$MANIFEST_URL" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Calculate APK SHA256
        id: hash
        shell: bash
        run: |
          APK_PATH="${{ steps.meta.outputs.apk_path }}"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          COMPAT_APK_PATH="${{ steps.meta.outputs.compat_apk_path }}"
          COMPAT_SHA256="$(sha256sum "$COMPAT_APK_PATH" | awk '{print $1}')"
          echo "compat_sha256=$COMPAT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Summarize release APK checksums
        shell: bash
        run: |
          {
            echo "### Release APK checksums"
            echo "| Package | SHA256 |"
            echo "|:--|:--|"
            echo "| ${{ steps.meta.outputs.apk_name }} | \`${{ steps.hash.outputs.sha256 }}\` |"
            echo "| ${{ steps.meta.outputs.compat_apk_name }} | \`${{ steps.hash.outputs.compat_sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate update manifest
        shell: bash
        run: |
          cat > update.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "versionCode": ${{ steps.meta.outputs.version_code }},
            "apkUrl": "${{ steps.meta.outputs.apk_url }}",
            "manifestUrl": "${{ steps.meta.outputs.manifest_url }}",
            "releasePage": "${{ steps.meta.outputs.release_url }}",
            "sha256": "${{ steps.hash.outputs.sha256 }}",
            "compatApkUrl": "${{ steps.meta.outputs.compat_apk_url }}",
            "compatSha256": "${{ steps.hash.outputs.compat_sha256 }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "force": false
          }
          EOF
          cat update.json

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.apk_path }}" \
            "${{ steps.meta.outputs.compat_apk_path }}" \
            update.json \
            --clobber

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          NOTES=$(gh release view "${{ steps.meta.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --json body -q .body 2>/dev/null || echo "Release ${{ steps.meta.outputs.version }}")
          echo "$NOTES" > /tmp/release-notes.md

      - name: Publish release to Xposed-Modules-Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "XPOSED_REPO_TOKEN not set, skipping sync"
            exit 0
          fi

          gh release create "${{ steps.meta.outputs.version_code }}-${{ steps.meta.outputs.version }}" \
            --repo Xposed-Modules-Repo/io.github.kwensiu.dpis \
            --title "${{ steps.meta.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            "${{ steps.meta.outputs.apk_path }}"
