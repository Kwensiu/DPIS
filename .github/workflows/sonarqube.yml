name: SonarQube

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - '.gitignore'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      vars.SONAR_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.1.0"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Compile sources for analysis
        shell: bash
        run: |
          ./gradlew :app:compileModernDebugKotlin \
            :app:compileModernDebugJavaWithJavac \
            :app:compileModernDebugUnitTestKotlin \
            :app:compileModernDebugUnitTestJavaWithJavac \
            --no-daemon --no-configuration-cache --stacktrace

      - name: Run SonarQube analysis
        shell: bash
        run: |
          extra_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            extra_args+=(
              "-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}"
              "-Dsonar.pullrequest.branch=${{ github.head_ref }}"
              "-Dsonar.pullrequest.base=${{ github.base_ref }}"
            )
          else
            extra_args+=(
              "-Dsonar.branch.name=${{ github.ref_name }}"
            )
          fi
          ./gradlew sonar \
            --no-daemon --no-configuration-cache --stacktrace \
            -Dsonar.gradle.skipCompile=true \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            "${extra_args[@]}"
