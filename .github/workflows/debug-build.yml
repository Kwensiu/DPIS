name: Debug build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_HARDLINK: 'true'
      CCACHE_NOHASHDIR: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      DPIS_CMAKE_VERSION: 3.22.1
      DPIS_CMAKE_COMPILER_LAUNCHER: ccache
      DPIS_NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmake;${DPIS_CMAKE_VERSION}" "ndk;${DPIS_NDK_VERSION}"

      - name: Install native build cache
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache -o max_size=1G
          ccache -o hash_dir=false
          ccache -o hard_link=true
          ccache -o compiler_check="$CCACHE_COMPILERCHECK"
          ccache -z

      - name: Cache native compilation
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ccache
            ~/.ccache
          key: native-ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            native-ccache-${{ runner.os }}-

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build debug APKs
        shell: bash
        run: |
          ./gradlew :app:assembleModernDebug :app:assembleLegacyDebug
          ccache -s

      - name: Collect debug APKs
        shell: bash
        run: |
          mkdir -p debug-apks
          cp app/build/outputs/apk/modern/debug/*.apk debug-apks/
          cp app/build/outputs/apk/legacy/debug/*.apk debug-apks/
          ls -lh debug-apks

      - name: Summarize debug APK checksums
        shell: bash
        run: |
          {
            echo "### Debug APK checksums"
            echo "| Package | SHA256 |"
            echo "|:--|:--|"
            for apk in debug-apks/*.apk; do
              package="$(basename "$apk")"
              echo "| ${package} | \`$(sha256sum "$apk" | awk '{print $1}')\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dpis-debug-apks
          path: debug-apks/*.apk
          if-no-files-found: error
          retention-days: 14
