name: debug apk build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew :app:assembleModern101Debug :app:assembleCompat100Debug

      - name: Collect debug APKs
        shell: bash
        run: |
          mkdir -p debug-apks
          cp app/build/outputs/apk/modern101/debug/*.apk debug-apks/
          cp app/build/outputs/apk/compat100/debug/*.apk debug-apks/
          ls -lh debug-apks

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dpis-debug-apks
          path: debug-apks/*.apk
          if-no-files-found: error
          retention-days: 14
